<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Próximamente — Un nuevo proyecto de Ezequiel García Gilabert.">
  <meta name="theme-color" content="#0a0807">
  <title>Próximamente — Ezequiel García Gilabert</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <div class="stage">

    <!-- Video layers -->
    <div class="stage__video">
      <video class="video-layer" muted loop playsinline preload="auto" data-index="0">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4">
      </video>
      <video class="video-layer" muted loop playsinline preload="auto" data-index="1">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4">
      </video>
      <video class="video-layer" muted loop playsinline preload="auto" data-index="2">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Overlays -->
    <div class="stage__overlay stage__overlay--gradient"></div>
    <div class="stage__overlay stage__overlay--warm"></div>
    <div class="stage__overlay stage__overlay--grain"></div>

    <!-- Paparazzi flashes -->
    <div class="stage__flashes" id="flashes" aria-hidden="true"></div>

    <!-- Content -->
    <main class="content">

      <section class="content__main">
        <h1 class="headline">
          ¿Estás listo para<br>
          <span class="headline__accent">alcanzar tu máximo potencial?</span>
        </h1>

        <p class="subtitle">
          No hace falta suerte. Hace falta <strong>idea, estructura y cabeza</strong>.<br>
          Con eso, se logra lo que sea.
        </p>
      </section>

      <footer class="content__footer">

        <div class="badge">
          <span class="badge__dot"></span>
          <span>Próximamente</span>
        </div>

        <div class="progress">
          <span>Avanzando</span>
          <div class="progress__track">
            <div class="progress__fill"></div>
          </div>
          <span class="progress__value" id="progressValue">0%</span>
        </div>

        <a class="credit"
           href="https://ezgilabert.github.io/ezequiel-dev/"
           target="_blank"
           rel="noopener noreferrer">
          Ezequiel García Gilabert
        </a>

      </footer>

    </main>
  </div>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
