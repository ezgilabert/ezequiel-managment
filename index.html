<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0807">
<title>Próximamente...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --loader-intro-delay: 250ms;
    --loader-content-enter-duration: 350ms;
    --loader-type-duration: 800ms;
  }
  html, body {
    height: 100%;
    min-height: 100%;
    margin: 0;
    background: #0a0807;
  }
  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #050405;
    color: #f5f0f0;
  }
  .page-loader__content {
    position: relative;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }
  .page-loader__label {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 30px rgba(255, 195, 155, .6);
  }
  .page-loader__dots {
    display: inline-flex;
    gap: 6px;
    margin-top: 4px;
  }
  .page-loader__dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffb89a;
  }
</style>
<link rel="preload" href="css/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="css/styles.css"></noscript>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,500&family=Cormorant+Garamond:ital,wght@1,400&display=swap"
      media="print"
      onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,500&family=Cormorant+Garamond:ital,wght@1,400&display=swap">
</noscript>
</head>
<body>

  <div class="page-loader" id="pageLoader" role="status" aria-label="Cargando página">
    <div class="page-loader__bg" aria-hidden="true"></div>
    <div class="page-loader__flashes" id="loaderFlashes" aria-hidden="true"></div>
    <div class="page-loader__content">
      <span class="page-loader__label">Cargando</span>
      <span class="page-loader__dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div class="page-loader__grain" aria-hidden="true"></div>
    <div class="page-loader__vignette" aria-hidden="true"></div>
  </div>

  <div class="stage-root">

    <div class="mix-stage" id="mixStage" aria-hidden="true">
      <video class="mix-layer" muted loop playsinline webkit-playsinline
             disablepictureinpicture preload="none" data-poster="assets/poster.jpg">
             <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4" media="(max-width: 899px)">
             <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4" media="(min-width: 900px)">
      </video>
    </div>

    <div class="overlay overlay--gradient" aria-hidden="true"></div>
    <div class="overlay overlay--warm" aria-hidden="true"></div>
    <div class="overlay overlay--grain" aria-hidden="true"></div>

    <div class="paparazzi" id="paparazzi" aria-hidden="true"></div>

    <main class="content-stage" id="contentStage" aria-hidden="true">
      <div class="content">

        <h1 class="headline">Estas listo para<br><span class="headline__accent">alcanzar tu máximo potencial.. ?</span></h1>

        <p class="subtitle" id="subtitleTypewriter" aria-live="polite">No hace falta suerte. Hace falta <strong>idea, estructura y cabeza</strong>.<br>Con eso, se logra lo que sea.</p>

        <div class="footer">
          <div class="eyebrow">
            <span class="eyebrow__dot" aria-hidden="true"></span>
            <span>Próximamente</span>
          </div>

          <div class="progress" role="status" aria-label="Progreso del proyecto">
            <span>Avanzando</span>
            <div class="progress__track" aria-hidden="true">
              <div class="progress__fill"></div>
            </div>
            <span class="progress__value">0%</span>
          </div>

          <a class="credit"
             href="https://ezequielgarciagilabert.com/dev/"
             target="_blank"
             rel="noopener noreferrer"
             title="Sitio de Ezequiel García Gilabert">
            Ezequiel García Gilabert
          </a>
        </div>

      </div>
    </main>

  </div>

  <script src="js/video-stage.js" defer></script>
  <script src="js/content-effects.js" defer></script>
  <script src="js/paparazzi.js" defer></script>
  <script src="js/script.js" defer></script>

</body>
</html>
