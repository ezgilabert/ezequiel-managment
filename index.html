<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0807">
<title>Próximamente...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --loader-intro-delay: 250ms;
    --loader-content-enter-duration: 350ms;
    --loader-type-duration: 800ms;
  }
  html, body {
    height: 100%;
    min-height: 100%;
    margin: 0;
    background: #120923;
  }
  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 18% 18%, rgba(54, 76, 169, 0.72), transparent 52%),
      radial-gradient(ellipse at 82% 78%, rgba(177, 34, 101, 0.68), transparent 54%),
      linear-gradient(135deg, #120923 0%, #211038 52%, #351126 100%);
    background-color: #211038;
    color: #f5f0f0;
    font: italic 2rem Georgia, serif;
  }
  .page-loader__content {
    position: relative;
    z-index: 5;
    opacity: 1;
    text-align: center;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
  }
  .page-loader__stage { display: none; }
  .page-loader__label {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .page-loader__label > span:first-child {
    display: inline-block;
    flex: 0 0 9ch;
    width: 9ch;
    overflow: hidden;
    clip-path: inset(0 100% 0 0);
    white-space: nowrap;
    animation: loader-type var(--loader-type-duration) steps(8, end)
      calc(var(--loader-intro-delay) + var(--loader-content-enter-duration)) forwards;
  }
  .page-loader__dots {
    display: flex;
    align-items: center;
    align-self: flex-end;
    gap: 4px;
    margin-bottom: 7px;
    opacity: 0;
    animation: initial-loader-dots-enter 250ms ease
      calc(var(--loader-intro-delay) + var(--loader-content-enter-duration) + var(--loader-type-duration)) forwards;
  }
  @keyframes initial-loader-dots-enter { to { opacity: 1; } }
  .page-loader__dots i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #e8a87c;
    animation: initial-loader-dot 1.4s ease-in-out infinite;
  }
  .page-loader__dots i:nth-child(2) { animation-delay: 200ms; }
  .page-loader__dots i:nth-child(3) { animation-delay: 400ms; }
  @keyframes initial-loader-dot {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  @keyframes loader-type { to { clip-path: inset(0); } }
</style>
<link rel="preload" href="css/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="css/styles.css"></noscript>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,500&family=Cormorant+Garamond:ital,wght@1,400&display=swap"
      media="print"
      onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,500&family=Cormorant+Garamond:ital,wght@1,400&display=swap">
</noscript>
</head>
<body>

  <div class="page-loader" id="pageLoader" role="status" aria-label="Cargando página">
    <svg class="page-loader__svg-defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="loaderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a3a8a"></stop>
          <stop offset="50%" stop-color="#c2185b"></stop>
          <stop offset="100%" stop-color="#ff6b35"></stop>
        </linearGradient>
      </defs>
    </svg>

    <div class="page-loader__ambient page-loader__ambient--blue" aria-hidden="true"></div>
    <div class="page-loader__ambient page-loader__ambient--magenta" aria-hidden="true"></div>
    <div class="page-loader__ambient page-loader__ambient--purple" aria-hidden="true"></div>
    <div class="page-loader__grid" aria-hidden="true"></div>
    <div class="page-loader__particles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="page-loader__noise" aria-hidden="true"></div>

    <div class="page-loader__content">
      <div class="page-loader__stage" aria-hidden="true">
        <svg class="page-loader__device" width="65" height="105" viewBox="0 0 50 80">
          <rect x="5" y="5" width="40" height="70" rx="6"></rect>
          <line x1="20" y1="10" x2="30" y2="10"></line>
          <circle cx="25" cy="68" r="3"></circle>
        </svg>
        <svg class="page-loader__device" width="90" height="115" viewBox="0 0 70 90">
          <rect x="5" y="5" width="60" height="80" rx="5"></rect>
          <circle cx="35" cy="78" r="3"></circle>
        </svg>
        <svg class="page-loader__device" width="130" height="95" viewBox="0 0 100 75">
          <rect x="15" y="10" width="70" height="45" rx="3"></rect>
          <polygon points="5,65 95,65 85,55 15,55"></polygon>
          <line x1="45" y1="60" x2="55" y2="60"></line>
        </svg>
        <svg class="page-loader__device" width="150" height="115" viewBox="0 0 120 90">
          <rect x="10" y="5" width="100" height="60" rx="4"></rect>
          <line x1="45" y1="65" x2="35" y2="85"></line>
          <line x1="75" y1="65" x2="85" y2="85"></line>
        </svg>
      </div>
      <div class="page-loader__label">
        <span>Cargando</span>
        <span class="page-loader__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>

  <div class="stage-root">

    <div class="mix-stage" id="mixStage" aria-hidden="true">
      <video class="mix-layer" muted loop playsinline webkit-playsinline
             disablepictureinpicture preload="none" data-poster="assets/poster.jpg">
             <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4" media="(max-width: 899px)">
             <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4" media="(min-width: 900px)">
      </video>
    </div>

    <div class="overlay overlay--gradient" aria-hidden="true"></div>
    <div class="overlay overlay--warm" aria-hidden="true"></div>
    <div class="overlay overlay--grain" aria-hidden="true"></div>

    <div class="paparazzi" id="paparazzi" aria-hidden="true"></div>

    <main class="content-stage" id="contentStage" aria-hidden="true">
      <div class="content">

        <h1 class="headline">Estas listo para<br><span class="headline__accent">alcanzar tu máximo potencial.. ?</span></h1>

        <p class="subtitle" id="subtitleTypewriter" aria-live="polite">No hace falta suerte. Hace falta <strong>idea, estructura y cabeza</strong>.<br>Con eso, se logra lo que sea.</p>

        <div class="footer">
          <div class="eyebrow">
            <span class="eyebrow__dot" aria-hidden="true"></span>
            <span>Próximamente</span>
          </div>

          <div class="progress" role="status" aria-label="Progreso del proyecto">
            <span>Avanzando</span>
            <div class="progress__track" aria-hidden="true">
              <div class="progress__fill"></div>
            </div>
            <span class="progress__value">0%</span>
          </div>

          <a class="credit"
             href="https://ezequielgarciagilabert.com/ezequiel-dev/"
             target="_blank"
             rel="noopener noreferrer"
             title="Sitio de Ezequiel García Gilabert">
            Ezequiel García Gilabert
          </a>
        </div>

      </div>
    </main>

  </div>

  <script src="js/video-stage.js" defer></script>
  <script src="js/content-effects.js" defer></script>
  <script src="js/paparazzi.js" defer></script>
  <script src="js/script.js" defer></script>

</body>
</html>
