<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #ff6b4a;
    --accent-soft: #ffb89a;
    --bg-dark: #0a0807;
    --text-primary: #fff;
    --text-muted: rgba(255, 245, 235, 0.7);
    --text-faint: rgba(255, 245, 235, 0.4);

    --t-headline:   1.6s;
    --t-subtitle:   4.0s;
    --t-f-eyebrow:  8.6s;
    --t-f-progress: 9.8s;
    --t-f-credit:  11.0s;
    --t-done:      12.4s;

    --d-reveal:  1.2s;
    --d-curtain: 2.6s;
    --ease-out:  cubic-bezier(0.19, 1, 0.22, 1);
    --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage-root { position: fixed; inset: 0; isolation: isolate; }

  .mix-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #1a1412;
    z-index: 1;
    contain: layout paint;
  }

  .mix-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    filter: contrast(1.05) brightness(0.95) saturate(1.1);
    transform-origin: center;
    backface-visibility: hidden;
    will-change: opacity, transform;
    transition:
      opacity 1.4s ease-in-out,
      transform 1.8s ease-in-out,
      object-position 1.8s ease-in-out;
    background-size: cover;
    background-position: center;
    background-color: #1a1412;
  }

  .mix-layer.is-visible { opacity: 1; }

  .mix-layer[data-mix-index="0"] {
    opacity: 1;
    transition: opacity 0.3s ease-in-out;
  }

  @media (max-width: 899px) {
    .mix-layer[data-mix-index="0"] { transform: scale(1.18) translateY(6%); }
    .mix-layer[data-mix-index="1"] { transform: scale(1.18) translateY(0%); }
    .mix-layer[data-mix-index="2"] { transform: scale(1.18) translateY(-6%); }
  }

  @media (min-width: 900px) {
    .mix-layer[data-mix-index="0"] { object-position: center 20%; }
    .mix-layer[data-mix-index="1"] { object-position: center 50%; }
    .mix-layer[data-mix-index="2"] { object-position: center 80%; }
  }

  .overlay { position: absolute; inset: 0; pointer-events: none; contain: layout paint; }

  .overlay--gradient {
    z-index: 2;
    background: linear-gradient(
      180deg,
      rgba(10, 8, 7, 0.15) 0%,
      rgba(10, 8, 7, 0.05) 40%,
      rgba(10, 8, 7, 0.85) 100%
    );
  }

  .overlay--warm {
    z-index: 2;
    mix-blend-mode: soft-light;
    background: linear-gradient(135deg, rgba(255, 107, 74, 0.18) 0%, rgba(0, 0, 0, 0) 100%);
  }

  .overlay--grain {
    z-index: 3;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .paparazzi {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
    contain: layout style paint;
  }

  .flash { position: absolute; opacity: 0; pointer-events: none; contain: layout style paint; }
  .flash--cone, .flash--halo, .flash--streak, .flash--floor { mix-blend-mode: screen; }

  .flash--cone {
    top: 0; height: 100%; width: 130%; max-width: 1600px;
    animation: flash-cone 140ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
  }
  .flash--cone.from-left  { left: 0;  transform-origin: left var(--y, 50%);  background: radial-gradient(ellipse 45% 55% at 0% var(--y,50%), rgba(255,255,255,1) 0%, rgba(255,250,240,0.95) 3%, rgba(255,235,215,0.7) 10%, rgba(255,210,180,0.3) 25%, rgba(255,190,160,0.08) 50%, transparent 72%); }
  .flash--cone.from-right { right: 0; transform-origin: right var(--y, 50%); background: radial-gradient(ellipse 45% 55% at 100% var(--y,50%), rgba(255,255,255,1) 0%, rgba(255,250,240,0.95) 3%, rgba(255,235,215,0.7) 10%, rgba(255,210,180,0.3) 25%, rgba(255,190,160,0.08) 50%, transparent 72%); }

  .flash--core {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    transform: translateY(-50%);
    animation: flash-core 120ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
    box-shadow:
      0 0 6px 2px #fff,
      0 0 18px 6px rgba(255, 240, 220, 1),
      0 0 60px 20px rgba(255, 210, 170, 0.8),
      0 0 160px 50px rgba(255, 180, 130, 0.4);
  }

  .flash--halo { top: 0; height: 100%; width: 55%; max-width: 700px; filter: blur(18px); animation: flash-halo 200ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards; }
  .flash--halo.from-left { left: 0; } .flash--halo.from-right { right: 0; }

  .flash--streak {
    height: 2px; width: 300px;
    transform-origin: left center;
    animation: flash-streak 160ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
  }
  .flash--streak::before, .flash--streak::after {
    content: ''; position: absolute; top: 50%; left: 0; transform: translateY(-50%);
  }
  .flash--streak::before { width: 50%; height: 100%; background: linear-gradient(90deg, rgba(255,248,240,1) 0%, rgba(255,240,225,0.5) 50%, transparent 100%); }
  .flash--streak::after  { width: 100%; height: 70%; background: linear-gradient(90deg, rgba(255,220,190,0.6) 0%, rgba(255,190,150,0.2) 35%, transparent 100%); filter: blur(1.5px); }
  .flash--streak.from-right { transform-origin: right center; }
  .flash--streak.from-right::before { left: auto; right: 0; background: linear-gradient(270deg, rgba(255,248,240,1) 0%, rgba(255,240,225,0.5) 50%, transparent 100%); }
  .flash--streak.from-right::after  { left: auto; right: 0; background: linear-gradient(270deg, rgba(255,220,190,0.6) 0%, rgba(255,190,150,0.2) 35%, transparent 100%); }

  .flash--floor { bottom: 0; height: 35%; width: 60%; max-width: 800px; filter: blur(14px); animation: flash-floor 220ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards; }
  .flash--floor.from-left { left: 0; } .flash--floor.from-right { right: 0; }

  @keyframes flash-cone  { 0%{opacity:0;transform:scaleX(.3) scaleY(.5);} 2%{opacity:1;transform:scaleX(1) scaleY(1);} 15%{opacity:.9;} 40%{opacity:.35;} 100%{opacity:0;transform:scaleX(1.1) scaleY(1.05);} }
  @keyframes flash-core  { 0%{opacity:0;transform:translateY(-50%) scale(.15);} 3%{opacity:1;transform:translateY(-50%) scale(1.4);} 20%{opacity:1;transform:translateY(-50%) scale(1);} 100%{opacity:0;transform:translateY(-50%) scale(.8);} }
  @keyframes flash-halo  { 0%{opacity:0;transform:scale(.6);} 5%{opacity:1;transform:scale(1);} 30%{opacity:.6;} 100%{opacity:0;transform:scale(1.1);} }
  @keyframes flash-streak{ 0%{opacity:0;transform:scaleX(.1);} 4%{opacity:1;transform:scaleX(1);} 25%{opacity:.7;} 100%{opacity:0;transform:scaleX(1.15);} }
  @keyframes flash-floor { 0%{opacity:0;transform:scaleY(.2);} 6%{opacity:.7;transform:scaleY(1);} 35%{opacity:.3;} 100%{opacity:0;transform:scaleY(1.1);} }

  .content-stage {
    position: relative;
    z-index: 10;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 56px;
  }

  .content { max-width: 820px; width: 100%; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }

  .content-stage .content > * { opacity: 0; }
  .content-stage.is-ready .content > * { opacity: 1; }

  .headline {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    margin-bottom: 28px;
    overflow-wrap: break-word;
    animation: reveal-curtain var(--d-curtain) var(--ease-soft) var(--t-headline) both;
  }

  .headline__accent { font-style: italic; font-weight: 500; color: var(--accent-soft); }

  .subtitle {
    display: block;
    font-size: clamp(0.95rem, 1.5vw, 1.1rem);
    font-weight: 300;
    line-height: 1.7;
    color: var(--text-muted);
    max-width: 540px; width: 100%; min-width: 0;
    margin-bottom: 44px;
    white-space: normal;
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-subtitle) both;
  }
  .subtitle strong { color: var(--text-primary); font-weight: 500; }
  .subtitle .word  { display: inline-block; white-space: nowrap; }
  .subtitle .space { display: inline-block; white-space: pre; }
  .subtitle .typewriter-char { opacity: 0; transition: opacity 0.12s ease; }
  .subtitle .typewriter-char.is-typed { opacity: 1; }
  .subtitle .typewriter-cursor {
    display: inline-block; width: 1px; height: 1em; margin-left: 2px; vertical-align: -0.15em;
    background: var(--accent-soft); box-shadow: 0 0 8px var(--accent-soft);
    opacity: 0; transition: opacity 0.35s ease;
  }
  .subtitle .typewriter-cursor.is-active { opacity: 1; animation: cursor-blink 0.9s steps(1) infinite; }
  @keyframes cursor-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .footer { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 0.7rem; font-weight: 400;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-soft); margin-bottom: 8px;
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-f-eyebrow) both;
  }
  .eyebrow__dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    animation: dot-pulse 2s ease-in-out infinite;
  }

  .progress {
    display: flex; align-items: center; gap: 14px;
    font-size: 0.65rem; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255, 245, 235, 0.5);
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-f-progress) both;
  }
  .progress__track { position: relative; width: 100px; height: 1px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .progress__fill  { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, var(--accent-soft), var(--accent)); animation: progress-fill 6s cubic-bezier(0.65,0,0.35,1) var(--t-f-progress) forwards; }
  .progress__value { min-width: 34px; display: inline-block; color: var(--accent-soft); font-variant-numeric: tabular-nums; }

  .credit {
    font-size: 0.62rem; font-weight: 400;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text-faint); text-decoration: none;
    transition: color 0.3s ease;
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-f-credit) both;
  }
  .credit:hover, .credit:focus-visible { color: var(--accent-soft); outline: none; }

  @keyframes reveal-soft {
    0%   { opacity: 0; transform: translateY(36px); filter: blur(6px); }
    40%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0);   filter: blur(0); }
  }
  @keyframes reveal-curtain {
    0%   { opacity: 0; transform: translateY(48px); clip-path: inset(0 0 100% 0); }
    35%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 -10% 0); }
  }
  @keyframes dot-pulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:.4; transform: scale(.8);} }
  @keyframes progress-fill { to { width: 78%; } }

  @media (max-width: 768px) {
    .content-stage { padding: 32px 20px; align-items: stretch; }
    .content { max-width: 100%; align-items: stretch; }
    .headline { margin-bottom: 22px; }
    .subtitle { max-width: 100%; margin-bottom: 32px; }
    .eyebrow  { font-size: 0.64rem; }
    .credit   { font-size: 0.56rem; }
    .flash--streak { width: 180px; height: 1.5px; }
  }

  @media (max-width: 480px) {
    .progress { gap: 10px; font-size: 0.6rem; letter-spacing: 0.16em; }
    .progress__track { width: 70px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .paparazzi { display: none; }
    .mix-layer { transition: opacity 0.6s linear; }
    .eyebrow__dot, .subtitle .typewriter-cursor { animation: none; }
    .headline, .subtitle, .eyebrow, .progress, .credit, .subtitle .typewriter-char {
      animation-duration: 0.01ms; animation-delay: 0s;
      transition: none; opacity: 1; transform: none; filter: none; clip-path: none;
    }
  }
</style>

  <script>
    (() => {
      'use strict';

      const TIMING = Object.freeze({
        headlineStart:    1600,
        cursorAppear:     5000,
        typewriterStart:  5600,
        progressStart:    9800,
        textsDone:        6000,
        progressDuration: 6000,
        progressTarget:    78,
        charDelay:          22,
        punctDelay:        140,
        dashDelay:         100,
        cursorFadeOut:     500
      });

      const FLASH = Object.freeze({
        layerRotationMs: 3200,
        maxConcurrent: 16,
        startDelayMin: 300,
        startDelayRange: 400,

        // Ramp: cuánto tarda en intensificarse
        rampUpMs: 30000,

        // Pausas entre eventos
        gapBuckets: [
          { p: 0.55, min: 300,  max: 900  },
          { p: 0.80, min: 900,  max: 2000 },
          { p: 0.94, min: 2000, max: 4000 },
          { min: 4000, max: 7000 }
        ],

        // Pausas dentro de una ráfaga
        intraGapBuckets: [
          { p: 0.50, min: 60,  max: 140 },
          { p: 0.85, min: 140, max: 280 },
          { min: 280, max: 500 }
        ],

        events: { chaotic: 0.22, crossed: 0.45, double: 0.62, burst: 0.85 },

        echo: { chance: 0.35, min: 150, max: 500 },

        bursts: {
          sameSide: { min: 2, extra: 3, intensity: [0.55, 1.05], falloff: [0.45, 0.85] },
          crossed:  { min: 2, extra: 4, intensity: [0.50, 0.95] },
          chaotic:  { min: 2, extra: 4 },
          double:   { delay: [50, 140], i1: [0.70, 1.00], i2: [0.40, 0.70] },
          single:   { intensity: [0.50, 0.95] }
        },

        cleanup: { cone: 400, core: 350, halo: 450, streak: 450, floor: 500 }
      });

      const rand   = (a, b) => a + Math.random() * (b - a);
      const coin   = (p = 0.5) => Math.random() < p;
      const pickSide = () => (coin() ? 'left' : 'right');

      // Distribución sesgada hacia un extremo (para que no sea uniforme)
      function biasedRandom(min, max, skew = 1) {
        return min + Math.pow(Math.random(), skew) * (max - min);
      }

      function sampleBuckets(buckets) {
        const roll = Math.random();
        for (let i = 0; i < buckets.length; i++) {
          const b = buckets[i];
          if (b.p === undefined || roll < b.p) return rand(b.min, b.max);
        }
        return rand(0, 1000);
      }

      function makeBezier(p1x, p1y, p2x, p2y) {
        const bx = (u) => 3 * (1 - u) ** 2 * u * p1x + 3 * (1 - u) * u ** 2 * p2x + u ** 3;
        const by = (u) => 3 * (1 - u) ** 2 * u * p1y + 3 * (1 - u) * u ** 2 * p2y + u ** 3;
        return (t) => {
          let lo = 0, hi = 1, mid = 0.5;
          for (let i = 0; i < 20; i++) { mid = (lo + hi) * 0.5; if (bx(mid) < t) lo = mid; else hi = mid; }
          return by(mid);
        };
      }
      const easeProgress = makeBezier(0.65, 0, 0.35, 1);

      const state = {
        progress: 0,
        reducedMotion: false,
        canceled: false,
        isMobile: false,
        ramp: 0,
        paparazziStartTime: 0
      };

      const timers = new Set();
      function later(fn, ms) {
        const id = setTimeout(() => { timers.delete(id); if (!state.canceled) fn(); }, ms);
        timers.add(id);
        return id;
      }

      function initProgress(counterEl) {
        if (!counterEl) return;
        const start = performance.now() + TIMING.progressStart;
        const dur   = TIMING.progressDuration;
        const target = TIMING.progressTarget;

        function frame(now) {
          if (state.canceled) return;
          const elapsed = now - start;
          if (elapsed < 0) { counterEl.textContent = '0%'; state.progress = 0; requestAnimationFrame(frame); return; }
          const t = Math.min(elapsed / dur, 1);
          const value = easeProgress(t) * target;
          counterEl.textContent = Math.round(value) + '%';
          state.progress = t;
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function initTypewriter() {
        const el = document.getElementById('subtitleTypewriter');
        if (!el || state.reducedMotion) return;

        const originalHTML = el.innerHTML;
        const wrapper = document.createElement('span');
        wrapper.style.display = 'contents';
        wrapper.innerHTML = originalHTML;

        const textNodes = [];
        (function collect(node) {
          for (let i = 0; i < node.childNodes.length; i++) {
            const child = node.childNodes[i];
            if (child.nodeType === Node.TEXT_NODE) textNodes.push(child);
            else if (child.nodeType === Node.ELEMENT_NODE) collect(child);
          }
        })(wrapper);

        const charSpans = [];
        for (let n = 0; n < textNodes.length; n++) {
          const textNode = textNodes[n];
          const text = textNode.nodeValue;
          const frag = document.createDocumentFragment();
          const tokens = text.split(/(\s+)/);
          for (let t = 0; t < tokens.length; t++) {
            const token = tokens[t];
            if (token === '') continue;
            if (/^\s+$/.test(token)) {
              const spaceSpan = document.createElement('span');
              spaceSpan.className = 'space';
              spaceSpan.textContent = '\u00A0';
              frag.appendChild(spaceSpan);
            } else {
              const wordSpan = document.createElement('span');
              wordSpan.className = 'word';
              for (let c = 0; c < token.length; c++) {
                const charSpan = document.createElement('span');
                charSpan.className = 'typewriter-char';
                charSpan.textContent = token[c];
                wordSpan.appendChild(charSpan);
                charSpans.push(charSpan);
              }
              frag.appendChild(wordSpan);
            }
          }
          textNode.parentNode.replaceChild(frag, textNode);
        }

        el.innerHTML = '';
        while (wrapper.firstChild) el.appendChild(wrapper.firstChild);

        const cursor = document.createElement('span');
        cursor.className = 'typewriter-cursor';
        cursor.setAttribute('aria-hidden', 'true');

        let i = 0, nextAt = 0, cursorReady = false;

        later(() => {
          if (state.canceled) return;
          el.insertBefore(cursor, el.firstChild);
          void cursor.offsetWidth;
          cursor.classList.add('is-active');
          cursorReady = true;
        }, TIMING.cursorAppear);

        function typeFrame(now) {
          if (state.canceled) return;
          if (!cursorReady) { requestAnimationFrame(typeFrame); return; }
          if (!nextAt) nextAt = now;
          if (now < nextAt) { requestAnimationFrame(typeFrame); return; }
          if (i >= charSpans.length) {
            later(() => {
              cursor.classList.remove('is-active');
              later(() => { if (cursor.isConnected) cursor.remove(); }, 400);
            }, TIMING.cursorFadeOut);
            return;
          }
          const span = charSpans[i];
          span.classList.add('is-typed');
          const ch = span.textContent;
          i++;
          span.parentNode.insertBefore(cursor, span.nextSibling);
          let delay = TIMING.charDelay;
          if (ch === '.' || ch === ',' || ch === ';') delay = TIMING.punctDelay;
          else if (ch === '—') delay = TIMING.dashDelay;
          nextAt = now + delay;
          requestAnimationFrame(typeFrame);
        }
        later(() => requestAnimationFrame(typeFrame), TIMING.typewriterStart);
      }

      function initLayerRotation() {
        const allLayers = Array.from(document.querySelectorAll('.mix-layer'));
        if (!allLayers.length) return;
        const layers = allLayers;

        let current = 0, started = false;

        const play = (v) => {
          v.muted = true;
          v.defaultMuted = true;
          v.setAttribute('muted', '');
          v.setAttribute('playsinline', '');

          const doPlay = () => {
            const p = v.play();
            if (p && p.catch) p.catch(err => console.warn('[video] play bloqueado:', err.name, err.message));
          };

          if (v.readyState >= 3) doPlay();
          else v.addEventListener('canplay', doPlay, { once: true });
        };

        const show = (index) => {
          for (let i = 0; i < layers.length; i++) {
            const active = i === index;
            layers[i].classList.toggle('is-visible', active);
            if (active) play(layers[i]);
            else layers[i].pause();
          }
        };

        show(0);

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) layers.forEach(v => v.pause());
          else play(layers[current]);
        }, { passive: true });

        window.__startVideoRotation = () => {
          if (started) return;
          started = true;
          setInterval(() => { current = (current + 1) % layers.length; show(current); }, FLASH.layerRotationMs);
        };

        const unlock = () => {
          play(layers[current]);
          document.removeEventListener('touchstart', unlock, { passive: true });
          document.removeEventListener('click', unlock, { passive: true });
        };
        document.addEventListener('touchstart', unlock, { passive: true });
        document.addEventListener('click', unlock, { passive: true });
      }

      function initPaparazzi() {
        if (state.reducedMotion) return;
        const root = document.getElementById('paparazzi');
        if (!root) return;

        state.paparazziStartTime = performance.now();

        // Loop que actualiza el ramp (0 → 1) con el tiempo
        (function rampLoop(now) {
          if (state.canceled) return;
          const elapsed = now - state.paparazziStartTime;
          let t = Math.min(elapsed / FLASH.rampUpMs, 1);
          // Smoothstep
          t = t * t * (3 - 2 * t);
          state.ramp = t;
          requestAnimationFrame(rampLoop);
        })(performance.now());

        let live = 0;
        function spawn(className, cleanupMs, configure) {
          if (live >= FLASH.maxConcurrent) return null;
          const el = document.createElement('div');
          el.className = className;
          if (configure) configure(el);
          root.appendChild(el);
          live++;
          later(() => { if (el.isConnected) el.remove(); live--; }, cleanupMs);
          return el;
        }

        // ---- Flash SIEMPRE desde los bordes, con posición Y MUY random ----
        function fireFlash(side, intensity) {
          const p = state.progress;
          const fi = intensity * (0.55 + p * 0.75);

          // Y en TODA la pantalla, con sesgo aleatorio
          // Usamos una mezcla de dos estrategias:
          //  - 60%: Y totalmente random 5% - 95%
          //  - 40%: Y con sesgo hacia un extremo (arriba o abajo)
          let y;
          if (coin(0.6)) {
            y = rand(5, 95);
          } else {
            // Sesgo: hacia arriba o hacia abajo
            const bias = coin() ? 0.35 : 2.8;
            y = biasedRandom(5, 95, bias);
          }

          // Profundidad (cámara lejos ↔ cámara cerca)
          const depth = Math.pow(Math.random(), 0.5);

          // Tamaño del cono (ancho y alto variados)
          const coneScaleX = rand(0.6, 1.4) * (0.85 + depth * 0.5);
          const coneScaleY = rand(0.85, 1.25);
          const coneBrightness = 0.5 + fi * 0.6 + depth * 0.3;

          // Intensidad final combinada
          const finalIntensity = fi * (0.55 + depth * 0.85);

          // Duración variable (rápidos y lentos)
          const coneDur = rand(80, 240);
          const coreDur = rand(70, 200);
          const haloDur = rand(140, 300);

          // Cono
          spawn(`flash flash--cone from-${side}`, FLASH.cleanup.cone, (el) => {
            el.style.setProperty('--y', y + '%');
            el.style.animationDuration = coneDur + 'ms';
            el.style.filter = `brightness(${coneBrightness})`;
            el.style.transformOrigin = `${side === 'left' ? 'left' : 'right'} ${y}%`;
            // Variamos el ancho del cono individualmente
            el.style.transform = `scale(${coneScaleX}, ${coneScaleY})`;
            el.style.opacity = (0.6 + depth * 0.4).toFixed(2);
          });

          // Núcleo
          const coreSize = rand(4, 16) + depth * 12;
          spawn('flash flash--core', FLASH.cleanup.core, (el) => {
            el.style.top = y + '%';
            el.style[side === 'left' ? 'left' : 'right'] = '-2px';
            el.style.width = coreSize + 'px';
            el.style.height = coreSize + 'px';
            el.style.animationDuration = coreDur + 'ms';
            el.style.transform = `translateY(-50%) scale(${0.5 + finalIntensity * 0.9})`;
          });

          // Halo (a veces)
          if (coin(0.7)) {
            const haloSize = rand(0.5, 1.5) + depth * 0.6;
            spawn(`flash flash--halo from-${side}`, FLASH.cleanup.halo, (el) => {
              el.style.animationDuration = haloDur + 'ms';
              el.style.transform = `scale(${haloSize})`;
              const pos = side === 'left' ? '0%' : '100%';
              el.style.background =
                `radial-gradient(ellipse 70% 80% at ${pos} ${y}%,` +
                ` rgba(255,245,230,${0.5 * finalIntensity}) 0%,` +
                ` rgba(255,225,200,${0.18 * finalIntensity}) 35%, transparent 70%)`;
            });
          }

          // Streaks (a veces, y más cuando el flash está cerca)
          const streaks = coin(0.4 + depth * 0.5) ? (coin(0.6) ? 1 : 2) : 0;
          for (let i = 0; i < streaks; i++) {
            later(() => {
              spawn(`flash flash--streak from-${side}`, FLASH.cleanup.streak, (el) => {
                const streakY = Math.max(2, Math.min(98, y + rand(-6, 6)));
                el.style.top = streakY + '%';
                el.style[side === 'left' ? 'left' : 'right'] = '0px';
                el.style.width = rand(120, 400) + 'px';
                el.style.height = rand(1, 3) + 'px';
                el.style.animationDuration = rand(100, 220) + 'ms';
              });
            }, i * rand(20, 60));
          }

          // Floor glow si está en la parte baja
          if (y > 55) {
            spawn(`flash flash--floor from-${side}`, FLASH.cleanup.floor, (el) => {
              el.style.animationDuration = rand(160, 280) + 'ms';
              const pos = side === 'left' ? '0%' : '100%';
              el.style.background =
                `radial-gradient(ellipse 70% 60% at ${pos} 100%,` +
                ` rgba(255,235,200,${0.45 * finalIntensity}) 0%,` +
                ` rgba(255,210,170,${0.14 * finalIntensity}) 40%, transparent 75%)`;
            });
          }
        }

        // El gap se reduce con el tiempo
        function gapScaled(buckets) {
          const base = sampleBuckets(buckets);
          const rampFactor = 1.8 - state.ramp * 1.5;
          return base * rampFactor * (1.1 - state.progress * 0.6);
        }
        function intraGapScaled() {
          const base = sampleBuckets(FLASH.intraGapBuckets);
          const rampFactor = 1.6 - state.ramp * 1.3;
          return base * rampFactor * (1.05 - state.progress * 0.5);
        }

        function scheduleBurst(count, sideAt, intensityAt) {
          let elapsed = 0;
          for (let i = 0; i < count; i++) {
            elapsed += intraGapScaled();
            const side = sideAt(i), intensity = intensityAt(i);
            later(() => fireFlash(side, intensity), elapsed);
          }
        }

        function burstSameSide() {
          const cfg = FLASH.bursts.sameSide;
          const side = pickSide();
          const count = cfg.min + Math.floor(Math.random() * (cfg.extra + state.ramp * 3));
          const base = rand(...cfg.intensity);
          scheduleBurst(count, () => side, (i) => (i === 0 ? base : base * rand(...cfg.falloff)));
        }

        function burstCrossed() {
          const cfg = FLASH.bursts.crossed;
          const seq = coin() ? ['left','right','left','right','left'] : ['right','left','right','left','right'];
          const count = cfg.min + Math.floor(Math.random() * (cfg.extra + state.ramp * 3));
          scheduleBurst(count, (i) => seq[i % seq.length], () => rand(...cfg.intensity));
        }

        function doublePop(side = pickSide()) {
          const cfg = FLASH.bursts.double;
          later(() => fireFlash(side, rand(...cfg.i1)), 0);
          later(() => fireFlash(side, rand(...cfg.i2)), rand(...cfg.delay));
        }

        function singleFlash() { fireFlash(pickSide(), rand(...FLASH.bursts.single.intensity)); }

        function chaoticCluster() {
          const cfg = FLASH.bursts.chaotic;
          const size = cfg.min + Math.floor(Math.random() * (cfg.extra + state.ramp * 5));
          let elapsed = 0;
          for (let i = 0; i < size; i++) {
            elapsed += intraGapScaled() + rand(0, 80);
            later(() => {
              const roll = Math.random();
              if (roll < 0.40) doublePop();
              else if (roll < 0.75) singleFlash();
              else fireFlash(pickSide(), rand(0.5, 1.05));
            }, elapsed);
          }
        }

        function pickEvent() {
          const bias = state.progress * 0.25;
          const ev = {
            chaotic: FLASH.events.chaotic + bias,
            crossed: FLASH.events.crossed + bias * 0.6,
            double:  FLASH.events.double  + bias * 0.4,
            burst:   FLASH.events.burst   + bias * 0.2
          };
          const total = ev.burst;
          const scale = total > 1 ? 1 / total : 1;
          const roll = Math.random();
          if (roll < ev.chaotic * scale) chaoticCluster();
          else if (roll < ev.crossed * scale) burstCrossed();
          else if (roll < ev.double * scale) doublePop();
          else if (roll < ev.burst * scale) burstSameSide();
          else singleFlash();
        }

        function scheduleNext() {
          if (state.canceled) return;
          const gap = gapScaled(FLASH.gapBuckets);
          later(() => {
            pickEvent();
            if (coin(FLASH.echo.chance * (0.4 + state.progress * 0.4 + state.ramp * 0.5))) {
              later(singleFlash, rand(FLASH.echo.min, FLASH.echo.max));
            }
            // A mayor ramp, más eventos paralelos
            if (state.ramp > 0.4 && coin(state.ramp * 0.7)) {
              const extraGap = gapScaled(FLASH.gapBuckets) * 0.5;
              later(() => {
                pickEvent();
                scheduleNext();
              }, extraGap);
            }
            scheduleNext();
          }, gap);
        }

        later(() => { doublePop(); scheduleNext(); },
              rand(FLASH.startDelayMin, FLASH.startDelayMin + FLASH.startDelayRange));
      }

      function bootContent() {
        const contentStage = document.getElementById('contentStage');
        if (contentStage) contentStage.classList.add('is-ready');

        const counterEl = document.querySelector('.progress__value');
        initProgress(counterEl);
        initTypewriter();

        later(() => {
          if (window.__startVideoRotation) window.__startVideoRotation();
          initPaparazzi();
        }, TIMING.textsDone);
      }

      function boot() {
        state.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        state.isMobile = window.matchMedia('(max-width: 899px)').matches;

        initLayerRotation();

        const firstVideo = document.querySelector('.mix-layer[data-mix-index="0"]');
        let contentStarted = false;
        const startContent = () => {
          if (contentStarted || state.canceled) return;
          contentStarted = true;
          bootContent();
        };

        if (!firstVideo) {
          startContent();
        } else {
          if (firstVideo.readyState >= 2) {
            startContent();
          } else {
            firstVideo.addEventListener('loadeddata', startContent, { once: true });
            firstVideo.addEventListener('canplay',    startContent, { once: true });
            firstVideo.addEventListener('error',      startContent, { once: true });
          }
          setTimeout(startContent, state.isMobile ? 400 : 800);
        }
      }

      window.addEventListener('pagehide', () => {
        state.canceled = true;
        for (const id of timers) clearTimeout(id);
        timers.clear();
      }, { once: true });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>

</body>
</html>
