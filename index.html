<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0807">
<title>Próximamente...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,500&display=swap" rel="stylesheet">
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --accent: #ff6b4a;
    --accent-soft: #ffb89a;
    --bg-dark: #0a0807;
    --text-primary: #fff;
    --text-muted: rgba(255, 245, 235, 0.7);
    --text-faint: rgba(255, 245, 235, 0.4);

    --t-headline:   1.6s;
    --t-subtitle:   4.0s;
    --t-f-eyebrow:  8.6s;
    --t-f-progress: 9.8s;
    --t-f-credit:  11.0s;
    --t-done:      12.4s;

    --d-reveal:  1.2s;
    --d-curtain: 2.6s;
    --ease-out:  cubic-bezier(0.19, 1, 0.22, 1);
    --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html,
  body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage-root {
    position: fixed;
    inset: 0;
    isolation: isolate;
  }

  .mix-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--bg-dark);
    z-index: 1;
    contain: layout paint;
  }

  .mix-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    filter: contrast(1.05) brightness(0.95) saturate(1.1);
    transform-origin: center;
    backface-visibility: hidden;
    will-change: opacity, transform;
    transition:
      opacity 1.4s ease-in-out,
      transform 1.8s ease-in-out,
      object-position 1.8s ease-in-out;
  }

  .mix-layer.is-visible {
    opacity: 1;
  }

  /* FIX: bajamos el scale en mobile para no ahogar la GPU */
  @media (max-width: 899px) {
    .mix-layer[data-mix-index="0"] { transform: scale(1.18) translateY(6%); }
    .mix-layer[data-mix-index="1"] { transform: scale(1.18) translateY(0%); }
    .mix-layer[data-mix-index="2"] { transform: scale(1.18) translateY(-6%); }

    /* FIX: en mobile ocultamos capas 1 y 2 del render por completo */
    .mix-layer:not([data-mix-index="0"]) {
      display: none;
    }
  }

  @media (min-width: 900px) {
    .mix-layer[data-mix-index="0"] { object-position: center 20%; }
    .mix-layer[data-mix-index="1"] { object-position: center 50%; }
    .mix-layer[data-mix-index="2"] { object-position: center 80%; }
  }

  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    contain: layout paint;
  }

  .overlay--gradient {
    z-index: 2;
    background: linear-gradient(
      180deg,
      rgba(10, 8, 7, 0.15) 0%,
      rgba(10, 8, 7, 0.05) 40%,
      rgba(10, 8, 7, 0.85) 100%
    );
  }

  .overlay--warm {
    z-index: 2;
    mix-blend-mode: soft-light;
    background: linear-gradient(
      135deg,
      rgba(255, 107, 74, 0.18) 0%,
      rgba(0, 0, 0, 0) 100%
    );
  }

  .overlay--grain {
    z-index: 3;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .paparazzi {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    overflow: hidden;
    contain: layout style paint;
  }

  .flash {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    contain: layout style paint;
  }

  .flash--cone,
  .flash--halo,
  .flash--streak,
  .flash--floor {
    mix-blend-mode: screen;
  }

  .flash--cone {
    top: 0;
    height: 100%;
    width: 130%;
    max-width: 1600px;
    animation: flash-cone 140ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
  }

  .flash--cone.from-left {
    left: 0;
    transform-origin: left var(--y, 50%);
    background: radial-gradient(
      ellipse 45% 55% at 0% var(--y, 50%),
      rgba(255, 255, 255, 1) 0%,
      rgba(255, 250, 240, 0.95) 3%,
      rgba(255, 235, 215, 0.7) 10%,
      rgba(255, 210, 180, 0.3) 25%,
      rgba(255, 190, 160, 0.08) 50%,
      transparent 72%
    );
  }

  .flash--cone.from-right {
    right: 0;
    transform-origin: right var(--y, 50%);
    background: radial-gradient(
      ellipse 45% 55% at 100% var(--y, 50%),
      rgba(255, 255, 255, 1) 0%,
      rgba(255, 250, 240, 0.95) 3%,
      rgba(255, 235, 215, 0.7) 10%,
      rgba(255, 210, 180, 0.3) 25%,
      rgba(255, 190, 160, 0.08) 50%,
      transparent 72%
    );
  }

  .flash--core {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    transform: translateY(-50%);
    animation: flash-core 120ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
    box-shadow:
      0 0 6px 2px #fff,
      0 0 18px 6px rgba(255, 240, 220, 1),
      0 0 60px 20px rgba(255, 210, 170, 0.8),
      0 0 160px 50px rgba(255, 180, 130, 0.4);
  }

  .flash--halo {
    top: 0;
    height: 100%;
    width: 55%;
    max-width: 700px;
    filter: blur(18px);
    animation: flash-halo 200ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
  }

  .flash--halo.from-left  { left: 0; }
  .flash--halo.from-right { right: 0; }

  .flash--streak {
    height: 2px;
    width: 300px;
    transform-origin: left center;
    animation: flash-streak 160ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
  }

  .flash--streak::before,
  .flash--streak::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
  }

  .flash--streak::before {
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, rgba(255,248,240,1) 0%, rgba(255,240,225,0.5) 50%, transparent 100%);
  }

  .flash--streak::after {
    width: 100%;
    height: 70%;
    background: linear-gradient(90deg, rgba(255,220,190,0.6) 0%, rgba(255,190,150,0.2) 35%, transparent 100%);
    filter: blur(1.5px);
  }

  .flash--streak.from-right {
    transform-origin: right center;
  }

  .flash--streak.from-right::before {
    left: auto;
    right: 0;
    background: linear-gradient(270deg, rgba(255,248,240,1) 0%, rgba(255,240,225,0.5) 50%, transparent 100%);
  }

  .flash--streak.from-right::after {
    left: auto;
    right: 0;
    background: linear-gradient(270deg, rgba(255,220,190,0.6) 0%, rgba(255,190,150,0.2) 35%, transparent 100%);
  }

  .flash--floor {
    bottom: 0;
    height: 35%;
    width: 60%;
    max-width: 800px;
    filter: blur(14px);
    animation: flash-floor 220ms cubic-bezier(0.02, 0.98, 0.1, 1) forwards;
  }

  .flash--floor.from-left  { left: 0; }
  .flash--floor.from-right { right: 0; }

  @keyframes flash-cone {
    0%   { opacity: 0; transform: scaleX(0.3) scaleY(0.5); }
    2%   { opacity: 1; transform: scaleX(1) scaleY(1); }
    15%  { opacity: 0.9; }
    40%  { opacity: 0.35; }
    100% { opacity: 0; transform: scaleX(1.1) scaleY(1.05); }
  }

  @keyframes flash-core {
    0%   { opacity: 0; transform: translateY(-50%) scale(0.15); }
    3%   { opacity: 1; transform: translateY(-50%) scale(1.4); }
    20%  { opacity: 1; transform: translateY(-50%) scale(1); }
    100% { opacity: 0; transform: translateY(-50%) scale(0.8); }
  }

  @keyframes flash-halo {
    0%   { opacity: 0; transform: scale(0.6); }
    5%   { opacity: 1; transform: scale(1); }
    30%  { opacity: 0.6; }
    100% { opacity: 0; transform: scale(1.1); }
  }

  @keyframes flash-streak {
    0%   { opacity: 0; transform: scaleX(0.1); }
    4%   { opacity: 1; transform: scaleX(1); }
    25%  { opacity: 0.7; }
    100% { opacity: 0; transform: scaleX(1.15); }
  }

  @keyframes flash-floor {
    0%   { opacity: 0; transform: scaleY(0.2); }
    6%   { opacity: 0.7; transform: scaleY(1); }
    35%  { opacity: 0.3; }
    100% { opacity: 0; transform: scaleY(1.1); }
  }

  /* ==================================================================
     CONTENT STAGE
     ================================================================== */
  .content-stage {
    position: relative;
    z-index: 10;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 56px;
  }

  .content {
    max-width: 820px;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }

  .headline {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    margin-bottom: 28px;
    overflow-wrap: break-word;
    animation: reveal-curtain var(--d-curtain) var(--ease-soft) var(--t-headline) both;
  }

  .headline__accent {
    font-style: italic;
    font-weight: 500;
    color: var(--accent-soft);
  }

  /* ==================================================================
     SUBTITLE — palabras atómicas
     ================================================================== */
  .subtitle {
    display: block;
    font-size: clamp(0.95rem, 1.5vw, 1.1rem);
    font-weight: 300;
    line-height: 1.7;
    color: var(--text-muted);
    max-width: 540px;
    width: 100%;
    min-width: 0;
    margin-bottom: 44px;
    white-space: normal;
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-subtitle) both;
  }

  .subtitle strong {
    color: var(--text-primary);
    font-weight: 500;
  }

  .subtitle .word {
    display: inline-block;
    white-space: nowrap;
  }

  .subtitle .space {
    display: inline-block;
    white-space: pre;
  }

  .subtitle .typewriter-char {
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .subtitle .typewriter-char.is-typed {
    opacity: 1;
  }

  .subtitle .typewriter-cursor {
    display: inline-block;
    width: 1px;
    height: 1em;
    margin-left: 2px;
    vertical-align: -0.15em;
    background: var(--accent-soft);
    box-shadow: 0 0 8px var(--accent-soft);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .subtitle .typewriter-cursor.is-active {
    opacity: 1;
    animation: cursor-blink 0.9s steps(1) infinite;
  }

  @keyframes cursor-blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 8px;
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-f-eyebrow) both;
  }

  .eyebrow__dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: dot-pulse 2s ease-in-out infinite;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 245, 235, 0.5);
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-f-progress) both;
  }

  .progress__track {
    position: relative;
    width: 100px;
    height: 1px;
    background: rgba(255, 255, 255, 0.15);
    overflow: hidden;
  }

  .progress__fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-soft), var(--accent));
    animation: progress-fill 6s cubic-bezier(0.65, 0, 0.35, 1) var(--t-f-progress) forwards;
  }

  .progress__value {
    min-width: 34px;
    display: inline-block;
    color: var(--accent-soft);
    font-variant-numeric: tabular-nums;
  }

  .credit {
    font-size: 0.62rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-faint);
    text-decoration: none;
    transition: color 0.3s ease;
    animation: reveal-soft var(--d-reveal) var(--ease-out) var(--t-f-credit) both;
  }

  .credit:hover,
  .credit:focus-visible {
    color: var(--accent-soft);
    outline: none;
  }

  @keyframes reveal-soft {
    0%   { opacity: 0; transform: translateY(36px); filter: blur(6px); }
    40%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0);   filter: blur(0); }
  }

  @keyframes reveal-curtain {
    0%   { opacity: 0; transform: translateY(48px); clip-path: inset(0 0 100% 0); }
    35%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 -10% 0); }
  }

  @keyframes dot-pulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }

  @keyframes progress-fill {
    to { width: 78%; }
  }

  @media (max-width: 768px) {
    .content-stage {
      padding: 32px 20px;
      align-items: stretch;
    }
    .content {
      max-width: 100%;
      align-items: stretch;
    }
    .headline { margin-bottom: 22px; }
    .subtitle {
      max-width: 100%;
      margin-bottom: 32px;
    }
    .eyebrow  { font-size: 0.64rem; }
    .credit   { font-size: 0.56rem; }
    .flash--streak { width: 180px; height: 1.5px; }
  }

  @media (max-width: 480px) {
    .progress { gap: 10px; font-size: 0.6rem; letter-spacing: 0.16em; }
    .progress__track { width: 70px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .paparazzi { display: none; }
    .mix-layer { transition: opacity 0.6s linear; }
    .eyebrow__dot,
    .subtitle .typewriter-cursor { animation: none; }

    .headline,
    .subtitle,
    .eyebrow,
    .progress,
    .credit,
    .subtitle .typewriter-char {
      animation-duration: 0.01ms;
      animation-delay: 0s;
      transition: none;
      opacity: 1;
      transform: none;
      filter: none;
      clip-path: none;
    }
  }
</style>
</head>
<body>

  <div class="stage-root">

    <!-- FIX: los 3 videos ahora tienen sources separados por media query.
         En mobile solo se sirve el HD, nunca el UHD.
         FIX: preload="auto" en la capa 0 para arrancar rápido.
         FIX: webkit-playsinline + disablepictureinpicture para iOS. -->
    <div class="mix-stage" id="mixStage" aria-hidden="true">
      <video class="mix-layer" muted loop playsinline webkit-playsinline disablepictureinpicture preload="auto" data-mix-index="0">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4" media="(max-width: 899px)">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4" media="(min-width: 900px)">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4">
      </video>
      <video class="mix-layer" muted loop playsinline webkit-playsinline disablepictureinpicture preload="metadata" data-mix-index="1">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4" media="(max-width: 899px)">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4" media="(min-width: 900px)">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4">
      </video>
      <video class="mix-layer" muted loop playsinline webkit-playsinline disablepictureinpicture preload="metadata" data-mix-index="2">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4" media="(max-width: 899px)">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-uhd_2160_3840_24fps.mp4" type="video/mp4" media="(min-width: 900px)">
        <source src="https://videos.pexels.com/video-files/9370435/9370435-hd_1080_1920_24fps.mp4" type="video/mp4">
      </video>
    </div>

    <div class="overlay overlay--gradient" aria-hidden="true"></div>
    <div class="overlay overlay--warm" aria-hidden="true"></div>
    <div class="overlay overlay--grain" aria-hidden="true"></div>

    <div class="paparazzi" id="paparazzi" aria-hidden="true"></div>

    <main class="content-stage">
      <div class="content">

        <h1 class="headline">Estas listo para<br><span class="headline__accent">alcanzar tu máximo potencial.. ?</span></h1>

        <p class="subtitle" id="subtitleTypewriter" aria-live="polite">No hace falta suerte. Hace falta <strong>idea, estructura y cabeza</strong>. Con eso, se logra lo que sea.</p>

        <div class="footer">
          <div class="eyebrow">
            <span class="eyebrow__dot" aria-hidden="true"></span>
            <span>Próximamente</span>
          </div>

          <div class="progress" role="status" aria-label="Progreso del proyecto">
            <span>Avanzando</span>
            <div class="progress__track" aria-hidden="true">
              <div class="progress__fill"></div>
            </div>
            <span class="progress__value">0%</span>
          </div>

          <a class="credit"
             href="https://ezgilabert.github.io/ezequiel-dev/"
             target="_blank"
             rel="noopener noreferrer"
             title="Sitio de Ezequiel García Gilabert">
            Ezequiel García Gilabert
          </a>
        </div>

      </div>
    </main>

  </div>

  <script>
    (() => {
      'use strict';

      const TIMING = Object.freeze({
        headlineStart:    1600,
        cursorAppear:     5000,
        typewriterStart:  5600,
        progressStart:    9800,
        textsDone:       12400,
        progressDuration: 6000,
        progressTarget:    78,
        charDelay:          22,
        punctDelay:        140,
        dashDelay:         100,
        cursorFadeOut:     500
      });

      const FLASH = Object.freeze({
        layerRotationMs: 3200,
        maxConcurrent: 16,
        startDelayMin: TIMING.progressStart,
        startDelayRange: 400,

        gapBuckets: [
          { p: 0.55, min: 450,  max: 1200 },
          { p: 0.85, min: 1200, max: 2600 },
          { p: 0.97, min: 2600, max: 6000 },
          { min: 6000, max: 10000 }
        ],

        intraGapBuckets: [
          { p: 0.40, min: 40,  max: 90  },
          { p: 0.80, min: 90,  max: 190 },
          { min: 190, max: 400 }
        ],

        y: { min: 12, range: 76, skew: 1.4 },

        events: { chaotic: 0.20, crossed: 0.42, double: 0.60, burst: 0.82 },

        echo: { chance: 0.45, min: 150, max: 700 },

        bursts: {
          sameSide: { min: 2, extra: 3, intensity: [0.65, 1.15], falloff: [0.45, 0.85] },
          crossed:  { min: 2, extra: 4, intensity: [0.55, 1.05] },
          chaotic:  { min: 2, extra: 4 },
          double:   { delay: [50, 140], i1: [0.85, 1.15], i2: [0.45, 0.80] },
          single:   { intensity: [0.60, 1.10] }
        },

        durations: {
          cone:   [110, 190],
          core:   [90,  150],
          halo:   [170, 250],
          streak: [130, 200],
          floor:  [190, 270]
        },

        cleanup: { cone: 350, core: 300, halo: 400, streak: 400, floor: 450 }
      });

      const rand   = (a, b) => a + Math.random() * (b - a);
      const coin   = (p = 0.5) => Math.random() < p;
      const pickSide = () => (coin() ? 'left' : 'right');

      function sampleBuckets(buckets) {
        const roll = Math.random();
        for (let i = 0; i < buckets.length; i++) {
          const b = buckets[i];
          if (b.p === undefined || roll < b.p) return rand(b.min, b.max);
        }
        return rand(0, 1000);
      }

      function makeBezier(p1x, p1y, p2x, p2y) {
        const bx = (u) => 3 * (1 - u) ** 2 * u * p1x + 3 * (1 - u) * u ** 2 * p2x + u ** 3;
        const by = (u) => 3 * (1 - u) ** 2 * u * p1y + 3 * (1 - u) * u ** 2 * p2y + u ** 3;
        return (t) => {
          let lo = 0, hi = 1, mid = 0.5;
          for (let i = 0; i < 20; i++) {
            mid = (lo + hi) * 0.5;
            if (bx(mid) < t) lo = mid; else hi = mid;
          }
          return by(mid);
        };
      }

      const easeProgress = makeBezier(0.65, 0, 0.35, 1);

      const state = {
        progress: 0,
        reducedMotion: false,
        canceled: false,
        isMobile: false
      };

      const timers = new Set();
      function later(fn, ms) {
        const id = setTimeout(() => {
          timers.delete(id);
          if (!state.canceled) fn();
        }, ms);
        timers.add(id);
        return id;
      }

      function initProgress(counterEl) {
        if (!counterEl) return;

        const start = performance.now() + TIMING.progressStart;
        const dur   = TIMING.progressDuration;
        const target = TIMING.progressTarget;

        function frame(now) {
          if (state.canceled) return;

          const elapsed = now - start;

          if (elapsed < 0) {
            counterEl.textContent = '0%';
            state.progress = 0;
            requestAnimationFrame(frame);
            return;
          }

          const t = Math.min(elapsed / dur, 1);
          const value = easeProgress(t) * target;

          counterEl.textContent = Math.round(value) + '%';
          state.progress = t;

          if (t < 1) requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      /* ==============================================================
         TYPEWRITER con palabras atómicas
         ============================================================== */
      function initTypewriter() {
        const el = document.getElementById('subtitleTypewriter');
        if (!el || state.reducedMotion) return;

        const originalHTML = el.innerHTML;

        const wrapper = document.createElement('span');
        wrapper.style.display = 'contents';
        wrapper.innerHTML = originalHTML;

        const textNodes = [];
        (function collect(node) {
          for (let i = 0; i < node.childNodes.length; i++) {
            const child = node.childNodes[i];
            if (child.nodeType === Node.TEXT_NODE) {
              textNodes.push(child);
            } else if (child.nodeType === Node.ELEMENT_NODE) {
              collect(child);
            }
          }
        })(wrapper);

        const charSpans = [];

        for (let n = 0; n < textNodes.length; n++) {
          const textNode = textNodes[n];
          const text = textNode.nodeValue;
          const frag = document.createDocumentFragment();

          const tokens = text.split(/(\s+)/);

          for (let t = 0; t < tokens.length; t++) {
            const token = tokens[t];
            if (token === '') continue;

            if (/^\s+$/.test(token)) {
              const spaceSpan = document.createElement('span');
              spaceSpan.className = 'space';
              spaceSpan.textContent = '\u00A0';
              frag.appendChild(spaceSpan);
            } else {
              const wordSpan = document.createElement('span');
              wordSpan.className = 'word';
              for (let c = 0; c < token.length; c++) {
                const ch = token[c];
                const charSpan = document.createElement('span');
                charSpan.className = 'typewriter-char';
                charSpan.textContent = ch;
                wordSpan.appendChild(charSpan);
                charSpans.push(charSpan);
              }
              frag.appendChild(wordSpan);
            }
          }

          textNode.parentNode.replaceChild(frag, textNode);
        }

        el.innerHTML = '';
        while (wrapper.firstChild) {
          el.appendChild(wrapper.firstChild);
        }

        const cursor = document.createElement('span');
        cursor.className = 'typewriter-cursor';
        cursor.setAttribute('aria-hidden', 'true');

        let i = 0;
        let nextAt = 0;
        let cursorReady = false;

        later(() => {
          if (state.canceled) return;
          el.insertBefore(cursor, el.firstChild);
          void cursor.offsetWidth;
          cursor.classList.add('is-active');
          cursorReady = true;
        }, TIMING.cursorAppear);

        function typeFrame(now) {
          if (state.canceled) return;

          if (!cursorReady) {
            requestAnimationFrame(typeFrame);
            return;
          }

          if (!nextAt) nextAt = now;

          if (now < nextAt) {
            requestAnimationFrame(typeFrame);
            return;
          }

          if (i >= charSpans.length) {
            later(() => {
              cursor.classList.remove('is-active');
              later(() => {
                if (cursor.isConnected) cursor.remove();
              }, 400);
            }, TIMING.cursorFadeOut);
            return;
          }

          const span = charSpans[i];
          span.classList.add('is-typed');
          const ch = span.textContent;
          i++;

          span.parentNode.insertBefore(cursor, span.nextSibling);

          let delay = TIMING.charDelay;
          if (ch === '.' || ch === ',' || ch === ';') delay = TIMING.punctDelay;
          else if (ch === '—') delay = TIMING.dashDelay;

          nextAt = now + delay;
          requestAnimationFrame(typeFrame);
        }

        later(() => requestAnimationFrame(typeFrame), TIMING.typewriterStart);
      }

      // FIX: reescrita la función de rotación de capas.
      // - En mobile solo 1 capa activa (nada de decodificar 3 videos).
      // - play() fuerza muted por propiedad además del atributo.
      // - No rotamos capas en mobile.
      // - visibilitychange no rompe el estado.
      function initLayerRotation() {
        const allLayers = Array.from(document.querySelectorAll('.mix-layer'));
        if (!allLayers.length) return;

        const isMobile = state.isMobile;

        // En mobile solo usamos la capa 0 (las otras están display:none por CSS)
        const layers = isMobile ? [allLayers[0]] : allLayers;

        let current = 0;
        let started = false;
        let rotationTimer = null;

        const play = (v) => {
          // FIX: forzamos muted en la propiedad (crítico en iOS)
          v.muted = true;
          v.defaultMuted = true;
          v.setAttribute('muted', '');
          v.setAttribute('playsinline', '');

          const p = v.play();
          if (p && p.catch) {
            p.catch((err) => {
              // FIX: log para diagnosticar en el celu
              console.warn('[video] play bloqueado:', err.name, err.message);
            });
          }
        };

        const show = (index) => {
          for (let i = 0; i < layers.length; i++) {
            const active = i === index;
            layers[i].classList.toggle('is-visible', active);
            if (active) play(layers[i]);
            else layers[i].pause();
          }
        };

        show(0);

        // FIX: reanudar sin re-pausar todo por scroll de barra de URL
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            layers.forEach((v) => v.pause());
          } else {
            play(layers[current]);
          }
        }, { passive: true });

        // FIX: en mobile NO rotamos capas
        window.__startVideoRotation = () => {
          if (started || isMobile) return;
          started = true;
          rotationTimer = setInterval(() => {
            current = (current + 1) % layers.length;
            show(current);
          }, FLASH.layerRotationMs);
        };

        // FIX: primer intento de play tras un toque del usuario (fallback
        // por si el autoplay fue bloqueado por política del navegador).
        const unlock = () => {
          play(layers[current]);
          document.removeEventListener('touchstart', unlock, { passive: true });
          document.removeEventListener('click', unlock, { passive: true });
        };
        document.addEventListener('touchstart', unlock, { passive: true, once: false });
        document.addEventListener('click', unlock, { passive: true, once: false });
      }

      function initPaparazzi() {
        if (state.reducedMotion) return;

        const root = document.getElementById('paparazzi');
        if (!root) return;

        let live = 0;

        function spawn(className, cleanupMs, configure) {
          if (live >= FLASH.maxConcurrent) return null;

          const el = document.createElement('div');
          el.className = className;
          if (configure) configure(el);
          root.appendChild(el);
          live++;

          later(() => {
            if (el.isConnected) el.remove();
            live--;
          }, cleanupMs);

          return el;
        }

        function fireFlash(side, intensity) {
          const p = state.progress;
          const fi = intensity * (0.5 + p * 0.9);
          const y = FLASH.y.min + Math.pow(Math.random(), FLASH.y.skew) * FLASH.y.range;

          spawn(`flash flash--cone from-${side}`, FLASH.cleanup.cone, (el) => {
            el.style.setProperty('--y', y + '%');
            el.style.animationDuration = rand(...FLASH.durations.cone) + 'ms';
            el.style.filter = `brightness(${0.7 + fi * 0.5})`;
          });

          spawn('flash flash--core', FLASH.cleanup.core, (el) => {
            el.style.top = y + '%';
            el.style[side === 'left' ? 'left' : 'right'] = '-2px';
            el.style.animationDuration = rand(...FLASH.durations.core) + 'ms';
            el.style.transform = `translateY(-50%) scale(${0.7 + fi * 0.6})`;
          });

          spawn(`flash flash--halo from-${side}`, FLASH.cleanup.halo, (el) => {
            el.style.animationDuration = rand(...FLASH.durations.halo) + 'ms';
            const pos = side === 'left' ? '0%' : '100%';
            el.style.background =
              `radial-gradient(ellipse 70% 80% at ${pos} ${y}%,` +
              ` rgba(255,245,230,${0.55 * fi}) 0%,` +
              ` rgba(255,225,200,${0.2 * fi}) 35%, transparent 70%)`;
          });

          const streaks = coin() ? 1 : (coin(0.7) ? 2 : 0);
          for (let i = 0; i < streaks; i++) {
            later(() => {
              spawn(`flash flash--streak from-${side}`, FLASH.cleanup.streak, (el) => {
                el.style.top = (y + rand(-4, 4)) + '%';
                el.style[side === 'left' ? 'left' : 'right'] = '0px';
                el.style.width = rand(180, 400) + 'px';
                el.style.animationDuration = rand(...FLASH.durations.streak) + 'ms';
              });
            }, i * rand(20, 60));
          }

          spawn(`flash flash--floor from-${side}`, FLASH.cleanup.floor, (el) => {
            el.style.animationDuration = rand(...FLASH.durations.floor) + 'ms';
            const pos = side === 'left' ? '0%' : '100%';
            el.style.background =
              `radial-gradient(ellipse 70% 60% at ${pos} 100%,` +
              ` rgba(255,235,200,${0.5 * fi}) 0%,` +
              ` rgba(255,210,170,${0.15 * fi}) 40%, transparent 75%)`;
          });
        }

        function gapScaled(buckets) {
          const base = sampleBuckets(buckets);
          return base * (1.4 - state.progress * 0.95);
        }

        function intraGapScaled() {
          const base = sampleBuckets(FLASH.intraGapBuckets);
          return base * (1.3 - state.progress * 0.85);
        }

        function scheduleBurst(count, sideAt, intensityAt) {
          let elapsed = 0;
          for (let i = 0; i < count; i++) {
            elapsed += intraGapScaled();
            const side = sideAt(i);
            const intensity = intensityAt(i);
            later(() => fireFlash(side, intensity), elapsed);
          }
        }

        function burstSameSide() {
          const cfg = FLASH.bursts.sameSide;
          const side = pickSide();
          const count = cfg.min + Math.floor(Math.random() * cfg.extra);
          const base = rand(...cfg.intensity);
          scheduleBurst(count, () => side, (i) => (i === 0 ? base : base * rand(...cfg.falloff)));
        }

        function burstCrossed() {
          const cfg = FLASH.bursts.crossed;
          const seq = coin()
            ? ['left', 'right', 'left', 'right', 'left']
            : ['right', 'left', 'right', 'left', 'right'];
          const count = cfg.min + Math.floor(Math.random() * cfg.extra);
          scheduleBurst(count, (i) => seq[i % seq.length], () => rand(...cfg.intensity));
        }

        function doublePop(side = pickSide()) {
          const cfg = FLASH.bursts.double;
          later(() => fireFlash(side, rand(...cfg.i1)), 0);
          later(() => fireFlash(side, rand(...cfg.i2)), rand(...cfg.delay));
        }

        function singleFlash() {
          fireFlash(pickSide(), rand(...FLASH.bursts.single.intensity));
        }

        function chaoticCluster() {
          const cfg = FLASH.bursts.chaotic;
          const size = cfg.min + Math.floor(Math.random() * cfg.extra);
          let elapsed = 0;
          for (let i = 0; i < size; i++) {
            elapsed += intraGapScaled() + rand(0, 80);
            later(() => {
              const roll = Math.random();
              if (roll < 0.35) doublePop();
              else if (roll < 0.70) singleFlash();
              else fireFlash(pickSide(), rand(0.7, 1.1));
            }, elapsed);
          }
        }

        function pickEvent() {
          const bias = state.progress * 0.35;
          const ev = {
            chaotic: FLASH.events.chaotic + bias,
            crossed: FLASH.events.crossed + bias * 0.6,
            double:  FLASH.events.double  + bias * 0.4,
            burst:   FLASH.events.burst   + bias * 0.2
          };
          const total = ev.burst;
          const scale = total > 1 ? 1 / total : 1;
          const roll = Math.random();

          if (roll < ev.chaotic * scale) chaoticCluster();
          else if (roll < ev.crossed * scale) burstCrossed();
          else if (roll < ev.double * scale) doublePop();
          else if (roll < ev.burst * scale) burstSameSide();
          else singleFlash();
        }

        function scheduleNext() {
          if (state.canceled) return;
          const gap = gapScaled(FLASH.gapBuckets);
          later(() => {
            pickEvent();
            if (coin(FLASH.echo.chance * (0.5 + state.progress))) {
              later(singleFlash, rand(FLASH.echo.min, FLASH.echo.max));
            }
            scheduleNext();
          }, gap);
        }

        later(() => {
          doublePop();
          scheduleNext();
        }, rand(FLASH.startDelayMin, FLASH.startDelayMin + FLASH.startDelayRange));
      }

      function boot() {
        state.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // FIX: detectamos mobile con matchMedia (mismo breakpoint que el CSS)
        state.isMobile = window.matchMedia('(max-width: 899px)').matches;

        initLayerRotation();

        const counterEl = document.querySelector('.progress__value');
        initProgress(counterEl);

        initTypewriter();

        later(() => {
          if (window.__startVideoRotation) window.__startVideoRotation();
          initPaparazzi();
        }, TIMING.textsDone);
      }

      window.addEventListener('pagehide', () => {
        state.canceled = true;
        for (const id of timers) clearTimeout(id);
        timers.clear();
      }, { once: true });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>

</body>
</html>
